name: Bara desktop and Linux backend release

on:
  push:
    tags: ["v*.*.*"]
    branches: ["feature/bara-ux-transformation"]
    paths: [".github/workflows/release-bara-windows.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        default: v0.1.8
        type: string

permissions:
  contents: write

concurrency:
  group: bara-windows-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v0.1.8' }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'Fresh-Industries/nima' && github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the bootstrap release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          draft="$(gh release view v0.1.8 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          echo "pending=$draft" >> "$GITHUB_OUTPUT"
      - name: Verify the source tag and staged artifacts
        if: steps.release.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source fetch --depth=1 https://github.com/Fresh-Industries/nima.git refs/tags/v0.1.8
          test "$(git -C source rev-parse 'FETCH_HEAD^{commit}')" = 8c78c12860c0290422ba56bfdc63d21bbfed5f7b
          mkdir release
          cd release
          base=https://bare-zebra.runlocal.eu/downloads/bara-0.1.8
          curl -fL --retry 3 --connect-timeout 20 --max-time 60 "$base/SHA256SUMS.txt" -o SHA256SUMS
          echo '5b1279e0ea9c1d888de3ea5599f3186ab43797aa55f86baf675082466f14ed58  SHA256SUMS' | sha256sum -c -
          for name in Bara-0.1.8-x64.exe Bara-0.1.8-x64.exe.blockmap latest.yml t3-0.1.8-linux-x64.tar.gz bara-studio-engine-windows-x64.exe bara-studio-engine-linux-x64; do
            remote="$name"
            if [[ "$name" == bara-studio-engine-linux-x64 ]]; then remote="$name.bin"; fi
            curl -fL --retry 3 --connect-timeout 20 --max-time 600 "$base/$remote" -o "$name"
          done
          sha256sum -c SHA256SUMS
      - name: Upload and verify the bootstrap release
        if: steps.release.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v0.1.8 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload v0.1.8 --repo "$GITHUB_REPOSITORY" --clobber release/*
          gh release download v0.1.8 --repo "$GITHUB_REPOSITORY" --dir verified
          (cd verified && sha256sum -c SHA256SUMS)
          cmp release/SHA256SUMS verified/SHA256SUMS
      - name: Publish the verified bootstrap release
        if: steps.release.outputs.pending == 'true'
        shell: bash
        run: gh release edit v0.1.8 --repo "$GITHUB_REPOSITORY" --draft=false --latest

  linux:
    if: github.repository == 'Fresh-Industries/nima' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && github.ref_name != 'v0.1.8'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v0.1.8' }}
      T3CODE_TELEMETRY_CHANNEL: dev
      T3CODE_WEB_SOURCEMAP: "0"
    steps:
      - name: Check out tagged Bara source
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/scripts...
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Prepare Linux archive tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libatomic1 patchelf
      - name: Acquire the verified Linux Studio CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .generated/studio-engine release
          gh release download v0.1.8 --repo "$GITHUB_REPOSITORY" --dir .generated/studio-engine \
            --pattern bara-studio-engine-linux-x64 --pattern SHA256SUMS
          (cd .generated/studio-engine && grep '  bara-studio-engine-linux-x64$' SHA256SUMS | sha256sum -c -)
          chmod +x .generated/studio-engine/bara-studio-engine-linux-x64
          echo "BARA_STUDIO_ENGINE_BINARY=$(pwd)/.generated/studio-engine/bara-studio-engine-linux-x64" >> "$GITHUB_ENV"
      - name: Build Linux backend with Studio
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p .generated/resource-monitor
          cp native/resource-monitor/target/release/t3-resource-monitor .generated/resource-monitor/
          vp run --filter @t3tools/web build
          node apps/server/scripts/cli.ts build
          node apps/server/scripts/cli.ts build-exe --target linux-x64
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "${RELEASE_TAG#v}" \
            --output-dir release --resource-monitor-dir .generated/resource-monitor
          cp "$BARA_STUDIO_ENGINE_BINARY" release/bara-studio-engine-linux-x64
          tar -xzf "release/t3-${RELEASE_TAG#v}-linux-x64.tar.gz" -C .generated
          test "$(.generated/t3-${RELEASE_TAG#v}-linux-x64/t3 --version)" = "t3 v${RELEASE_TAG#v}"
          .generated/t3-${RELEASE_TAG#v}-linux-x64/studio/bara-cli capabilities >/dev/null
      - name: Retain Linux backend for publication
        uses: actions/upload-artifact@v7
        with:
          name: bara-linux-backend
          path: release/*
          if-no-files-found: error

  windows:
    needs: linux
    if: github.repository == 'Fresh-Industries/nima' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && github.ref_name != 'v0.1.8'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v0.1.8' }}
      BARA_DESKTOP_UPDATE_REPOSITORY: Fresh-Industries/nima
      T3CODE_TELEMETRY_CHANNEL: dev

    steps:
      - name: Validate release tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1

      - name: Check out tagged Bara source
        run: |
          set -euo pipefail
          git init .
          git config core.longpaths true
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Verify version and source
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const version=process.env.RELEASE_TAG.slice(1);
          for(const file of ['apps/desktop/package.json','apps/server/package.json','apps/web/package.json','packages/contracts/package.json'])
            assert.equal(JSON.parse(fs.readFileSync(file,'utf8')).version,version,file);
          JS

      - name: Set up workspace dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      # Git Bash puts GNU coreutils `link` ahead of MSVC's link.exe, which breaks Rust builds.
      - name: Pin the MSVC linker for Rust
        shell: pwsh
        run: |
          $linker = Get-Command link.exe -All | Where-Object { $_.Source -like '*\VC\Tools\MSVC\*' } | Select-Object -First 1
          if (-not $linker) { throw 'MSVC link.exe was not found on PATH.' }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$($linker.Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Acquire the verified Studio CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .generated/studio-engine
          gh release download v0.1.8 --repo "$GITHUB_REPOSITORY" --dir .generated/studio-engine \
            --pattern bara-studio-engine-windows-x64.exe --pattern SHA256SUMS
          (cd .generated/studio-engine && grep '  bara-studio-engine-windows-x64.exe$' SHA256SUMS | sha256sum -c -)
          engine="$(pwd)/.generated/studio-engine/bara-studio-engine-windows-x64.exe"
          [[ -f "$engine" ]]
          echo "BARA_STUDIO_ENGINE_BINARY=$(cygpath -w "$engine")" >> "$GITHUB_ENV"

      - name: Build and validate Windows desktop
        run: |
          set -euo pipefail
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --output-dir release

      - name: Collect Linux backend
        uses: actions/download-artifact@v8
        with:
          name: bara-linux-backend
          path: release

      - name: Validate update metadata and prepare checksums
        working-directory: scripts
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import * as Schema from 'effect/Schema';
          import { fromYaml } from '@t3tools/shared/schemaYaml';
          const version=process.env.RELEASE_TAG.slice(1);
          const folder=path.resolve('../release');
          const name='Bara-'+version+'-x64.exe';
          const manifest=Schema.decodeUnknownSync(fromYaml(Schema.Struct({
            version:Schema.String,path:Schema.String,sha512:Schema.String,
            files:Schema.Array(Schema.Struct({url:Schema.String,sha512:Schema.String,size:Schema.Number}))
          })))(fs.readFileSync(path.join(folder,'latest.yml'),'utf8'));
          assert.equal(manifest.version,version);
          assert.equal(manifest.path,name);
          const bytes=fs.readFileSync(path.join(folder,name));
          const digest=crypto.createHash('sha512').update(bytes).digest('base64');
          assert.equal(manifest.sha512,digest);
          const entry=manifest.files.find(file=>file.url===name);
          assert.ok(entry);assert.equal(entry.sha512,digest);assert.equal(entry.size,bytes.length);
          const engineName='bara-studio-engine-windows-x64.exe';
          fs.copyFileSync(process.env.BARA_STUDIO_ENGINE_BINARY,path.join(folder,engineName));
          const files=[name,name+'.blockmap','latest.yml',engineName,'t3-'+version+'-linux-x64.tar.gz','bara-studio-engine-linux-x64'];
          const sums=files.map(file=>crypto.createHash('sha256').update(fs.readFileSync(path.join(folder,file))).digest('hex')+'  '+file);
          fs.writeFileSync(path.join(folder,'SHA256SUMS'),sums.join('\n')+'\n');
          fs.mkdirSync('../.generated',{recursive:true});
          fs.writeFileSync('../.generated/bara-release-notes.md',[
            'Bara '+version+' — Windows x64 desktop beta.',
            '',
            'Download Bara-'+version+'-x64.exe and install it over your existing Bara installation. Existing Bara data paths are preserved.',
            '',
            'This release includes Bara’s GitHub update feed. Older local 0.1.6 builds need this one-time manual installation. Afterward, Settings → About → Check for Updates can download and install future Bara releases.',
            '',
            'Includes the personal assistant and scoped memory, Bots and routines, Work and Inbox, Goals, Library, Studio, project Work navigation, and continuous previous-day chat history.',
            '',
            'The Windows beta is unsigned. A supported provider must be configured to execute agent turns. Studio video exports require FFmpeg. SSH setup downloads the matching Bara Linux x64 backend, including Inbox and Studio. Other remote platforms require a compatible Bara server.',
            '',
            'T3 Code’s MIT license and attribution remain intact. The separate Studio CLI is reused from the verified v0.1.8 Bara engine assets, with its digest in SHA256SUMS. Its extra asset is for packaging; normal use needs only the installer.',
            '',
            'SHA256SUMS covers the installer, blockmap, update metadata, Linux backend and Studio engines.'
          ].join('\n'));
          console.log('Validated installer version, byte count and SHA-512 against latest.yml.');
          JS

      - name: Prepare draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > .generated/existing-release.json 2>/dev/null; then
            node --input-type=module -e "import fs from 'node:fs'; if (!JSON.parse(fs.readFileSync('.generated/existing-release.json')).isDraft) throw Error('This release is already published; create a new version instead.');"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Bara ${RELEASE_TAG#v} — Windows beta" --notes-file .generated/bara-release-notes.md
          fi
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "release/Bara-$version-x64.exe" \
            "release/Bara-$version-x64.exe.blockmap" \
            release/latest.yml release/SHA256SUMS release/bara-studio-engine-windows-x64.exe \
            "release/t3-$version-linux-x64.tar.gz" release/bara-studio-engine-linux-x64

      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .generated/upload-check \
            --pattern "Bara-${RELEASE_TAG#v}-x64.exe" \
            --pattern "Bara-${RELEASE_TAG#v}-x64.exe.blockmap" \
            --pattern latest.yml --pattern SHA256SUMS --pattern bara-studio-engine-windows-x64.exe \
            --pattern "t3-${RELEASE_TAG#v}-linux-x64.tar.gz" --pattern bara-studio-engine-linux-x64
          cd .generated/upload-check
          sha256sum -c SHA256SUMS

      - name: Publish Bara release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" == true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
